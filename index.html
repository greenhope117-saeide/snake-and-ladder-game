<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>زیست‌یار | مار و پله بی‌مهرگان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #0b1f3a, #0f766e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: 'Vazirmatn', sans-serif;
}

.container {
  background: white;
  max-width: 1000px;
  width: 100%;
  border-radius: 45px;
  padding: 25px;
  box-shadow: 0 30px 50px rgba(0,0,0,0.3);
}

.school-header {
  text-align: center;
  margin-bottom: 20px;
}

.school-icon {
  display: inline-block;
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #1e3a5f, #0f766e);
  border-radius: 50%;
  line-height: 60px;
  font-size: 1.8rem;
  margin-bottom: 8px;
}

.school-name {
  background: #e0f2fe;
  display: inline-block;
  padding: 5px 20px;
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 700;
  color: #1e3a5f;
}

h1 {
  text-align: center;
  font-size: 1.5rem;
  margin: 10px 0 5px;
  background: linear-gradient(135deg, #0b1f3a, #0f766e);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.designer {
  text-align: center;
  font-size: 0.8rem;
  color: #0f766e;
  margin-bottom: 15px;
  font-weight: 500;
}

.game-area {
  display: flex;
  flex-direction: row;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.board {
  background: #f1f5f9;
  border-radius: 20px;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  max-width: 400px;
  flex: 1;
}

.cell {
  aspect-ratio: 1;
  background: white;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.85rem;
  color: #0b1f3a;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.cell.player {
  background: #0ea5e9;
  color: white;
  box-shadow: 0 0 0 3px #fbbf24;
}

.cell.snake {
  background: #ef4444;
  color: white;
}

.cell.ladder {
  background: #22c55e;
  color: white;
}

.question-panel {
  background: #f8fafc;
  border-radius: 25px;
  padding: 18px;
  flex: 1;
  min-width: 260px;
}

.question-text {
  background: #f1f5f9;
  padding: 15px;
  border-radius: 20px;
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 15px;
  text-align: center;
  border-right: 4px solid #0f766e;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 15px;
}

.opt-btn {
  padding: 12px;
  background: #0ea5e9;
  color: white;
  border: none;
  border-radius: 30px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.opt-btn:hover {
  transform: translateY(-2px);
  background: #0284c7;
}

.opt-btn.correct-effect {
  background: #22c55e;
}

.opt-btn.wrong-effect {
  background: #ef4444;
  animation: shake 0.3s;
}

.feedback {
  padding: 10px;
  border-radius: 18px;
  margin: 12px 0;
  font-size: 0.8rem;
  text-align: center;
}

.dice-area {
  text-align: center;
  margin-top: 12px;
}

.dice-btn {
  background: #fbbf24;
  color: #0b1f3a;
  padding: 10px 20px;
  font-size: 1rem;
  font-weight: 800;
  border: none;
  border-radius: 40px;
  cursor: pointer;
}

.dice-result {
  font-size: 1.8rem;
  font-weight: 800;
  margin-top: 8px;
}

.score-board {
  margin-top: 15px;
  text-align: center;
  background: #e2e8f0;
  padding: 8px;
  border-radius: 25px;
  font-weight: 700;
  font-size: 0.9rem;
}

.restart-btn {
  background: #0f766e;
  padding: 8px 18px;
  margin-top: 12px;
  border: none;
  border-radius: 25px;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

@media (max-width: 700px) {
  .board {
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }
  .cell {
    font-size: 0.7rem;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="school-header">
    <div class="school-icon">🧬</div>
    <div class="school-name">🏫 مدرسه فرزانگان ۱ شهریار</div>
    <h1>🎲 مار و پله بی‌مهرگان 🐍</h1>
    <div class="designer">✨ طراح: سرکار خانم معصومه مرتجایی</div>
  </div>

  <div class="game-area">
    <div class="board" id="board"></div>
    <div class="question-panel">
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsDiv"></div>
      <div class="feedback" id="feedback"></div>
      <div class="dice-area">
        <button class="dice-btn" id="diceBtn">🎲 تاس بنداز</button>
        <div class="dice-result" id="diceResult"></div>
      </div>
      <div class="score-board">📍 موقعیت شما: خانه <span id="playerPos">1</span> از 25</div>
      <button class="restart-btn" id="restartBtn">🔄 بازی جدید</button>
    </div>
  </div>
</div>

<script>
// ========== 24 سوال کاملاً غیر تکراری ==========
const questions = [
  { text: "کدام یک از موارد زیر جزو کرم‌های حلقوی است؟", options: ["کرم خاکی", "کرم کدو", "اسکاریس"], correct: 0, explanation: "✅ کرم خاکی از شاخه آنلیدا (کرم‌های حلقوی) است." },
  { text: "کرم اسکاریس از کدام گروه کرم‌ها است؟", options: ["پهن", "لوله‌ای", "حلقوی"], correct: 1, explanation: "✅ اسکاریس از شاخه نماتودا (کرم‌های لوله‌ای) است." },
  { text: "کدام یک از کرم‌های زیر زندگی آزاد دارد؟", options: ["کرم کدو", "پلاناریا", "کپلک"], correct: 1, explanation: "✅ پلاناریا از کرم‌های پهن آزادزی است." },
  { text: "کدامیک جزو سخت پوستان است؟", options: ["کنه", "خرخاکی", "عقرب"], correct: 1, explanation: "✅ خرخاکی از زیرشاخه سخت پوستان است." },
  { text: "کدامیک ۸ پا دارد؟", options: ["خرخاکی", "ملخ", "عقرب"], correct: 2, explanation: "✅ عقرب از عنکبوتیان و ۸ پا دارد." },
  { text: "کدامیک دگردیسی ناقص دارد؟", options: ["پروانه", "ملخ", "پشه"], correct: 1, explanation: "✅ ملخ دارای دگردیسی ناقص است." },
  { text: "کدامیک دستگاه گردش آب دارد؟", options: ["مرجان", "اسفنج", "ستاره دریایی"], correct: 2, explanation: "✅ ستاره دریایی (خارپوستان) دارای دستگاه گردش آب است." },
  { text: "کدامیک در روده سگ بالغ می‌شود؟", options: ["کرم کدو", "کپلک", "مولد کیست هیداتیک"], correct: 0, explanation: "✅ کرم کدو بالغ در روده سگ زندگی می‌کند." },
  { text: "کدامیک در روده بزرگ زندگی می‌کند؟", options: ["آسکاریس", "کرم قلابدار", "کرمک"], correct: 2, explanation: "✅ کرمک در روده بزرگ و ناحیه مقعد زندگی می‌کند." },
  { text: "کدام یک از بندپایان دو جفت پا در هر بند دارد؟", options: ["حشرات", "عنکبوتیان", "هزارپایان"], correct: 2, explanation: "✅ هزارپایان در هر بند دو جفت پا دارند." },
  { text: "کدام یک از جانوران زیر جزو نرم‌تنان است؟", options: ["خرچنگ", "حلزون", "عنکبوت"], correct: 1, explanation: "✅ حلزون از شاخه نرم‌تنان است." },
  { text: "کدام یک از موارد زیر از ویژگی‌های بندپایان نیست؟", options: ["اسکلت خارجی", "بدن قطعه‌قطعه", "اسکلت داخلی"], correct: 2, explanation: "✅ بندپایان اسکلت خارجی دارند، نه داخلی." },
  { text: "کدام گروه از بی‌مهرگان دارای کیسه گوارش هستند؟", options: ["کرم‌های پهن", "کرم‌های حلقوی", "نرم‌تنان"], correct: 0, explanation: "✅ کرم‌های پهن دارای کیسه گوارش هستند." },
  { text: "کدام جانور از طریق آبشش تنفس می‌کند؟", options: ["حلزون خشکی", "خرچنگ", "عنکبوت"], correct: 1, explanation: "✅ خرچنگ با آبشش تنفس می‌کند." },
  { text: "کدام یک از جانوران زیر تقارن شعاعی دارد؟", options: ["کرم خاکی", "ماهی", "ستاره دریایی"], correct: 2, explanation: "✅ ستاره دریایی تقارن شعاعی دارد." },
  { text: "کدام یک از موارد زیر جزو زنبورهای اجتماعی است؟", options: ["زنبور عسل", "زنبور گال‌زا", "زنبور تنها"], correct: 0, explanation: "✅ زنبور عسل یک حشره اجتماعی است." },
  { text: "کرم کدو از کدام گروه کرم‌ها است؟", options: ["پهن", "لوله‌ای", "حلقوی"], correct: 0, explanation: "✅ کرم کدو از شاخه کرم‌های پهن است." },
  { text: "کدامیک از حشرات دگردیسی کامل دارد؟", options: ["ملخ", "سوسک", "پروانه"], correct: 2, explanation: "✅ پروانه دارای دگردیسی کامل است." },
  { text: "کدامیک از کرم‌های زیر در روده کوچک زندگی می‌کند؟", options: ["کرمک", "آسکاریس", "کرم قلابدار"], correct: 1, explanation: "✅ آسکاریس در روده کوچک زندگی می‌کند." },
  { text: "کدامیک از بندپایان سه جفت پا دارد؟", options: ["عنکبوت", "خرچنگ", "ملخ"], correct: 2, explanation: "✅ ملخ از حشرات و ۶ پا (سه جفت) دارد." },
  { text: "کدامیک دارای اسکلت آهکی است؟", options: ["خرچنگ", "عنکبوت", "کرم خاکی"], correct: 0, explanation: "✅ خرچنگ از سخت پوستان و دارای اسکلت آهکی است." },
  { text: "کدامیک از بی‌مهرگان در آب شیرین زندگی می‌کند؟", options: ["اسفنج دریایی", "پلاناریا", "ستاره دریایی"], correct: 1, explanation: "✅ پلاناریا از کرم‌های پهن آب شیرین است." },
  { text: "کدامیک از کرم‌های زیر انگل خارجی موقت است؟", options: ["کرم خاکی", "زالو", "پلاناریا"], correct: 1, explanation: "✅ زالو برخی گونه‌هایش انگل خارجی موقت است." },
  { text: "میزبان واسط کرم کدو چیست؟", options: ["انسان", "گاو و خوک", "سگ"], correct: 1, explanation: "✅ گاو و خوک میزبان واسط کرم کدو هستند." }
];

// مارها و پله‌ها (مسیر 25 خانه‌ای)
const snakes = { 22: 10, 18: 6, 14: 4 };
const ladders = { 3: 13, 5: 19, 8: 17, 12: 23 };

let playerPos = 1;
let diceValue = 0;
let waitingForQuestion = false;
let currentQuestion = null;
let answered = false;

function getRandomQuestion() {
  const randomIndex = Math.floor(Math.random() * questions.length);
  return { ...questions[randomIndex], index: randomIndex };
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let i = 25; i >= 1; i--) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerText = i;
    if (playerPos === i) cell.classList.add("player");
    if (snakes[i]) { cell.classList.add("snake"); cell.innerText = i + "🐍"; }
    if (ladders[i]) { cell.classList.add("ladder"); cell.innerText = i + "🪜"; }
    board.appendChild(cell);
  }
}

function showQuestion() {
  const q = getRandomQuestion();
  currentQuestion = q;
  answered = false;
  document.getElementById("questionText").innerHTML = q.text;
  const optionsDiv = document.getElementById("optionsDiv");
  optionsDiv.innerHTML = "";
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(idx, btn);
    optionsDiv.appendChild(btn);
  });
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("diceBtn").disabled = true;
  waitingForQuestion = true;
}

function checkAnswer(selectedIdx, btnElement) {
  if (!waitingForQuestion || answered) return;
  answered = true;
  const isCorrect = (selectedIdx === currentQuestion.correct);
  const feedbackDiv = document.getElementById("feedback");
  
  if (isCorrect) {
    btnElement.classList.add("correct-effect");
    feedbackDiv.innerHTML = "✅ " + currentQuestion.explanation;
    feedbackDiv.style.background = "#dcfce7";
    feedbackDiv.style.color = "#166534";
    let newPos = playerPos + diceValue;
    if (newPos > 25) newPos = 25;
    if (ladders[newPos]) { newPos = ladders[newPos]; feedbackDiv.innerHTML += "<br>🎉 پله! به خانه " + newPos + " رفتی!"; }
    if (snakes[newPos]) { newPos = snakes[newPos]; feedbackDiv.innerHTML += "<br>🐍 مار! به خانه " + newPos + " رفتی!"; }
    playerPos = newPos;
    document.getElementById("playerPos").innerText = playerPos;
    renderBoard();
    if (playerPos === 25) {
      feedbackDiv.innerHTML = "🎉🎊 تبریک! به انتهای بازی رسیدی! 🎊🎉";
      document.getElementById("diceBtn").disabled = true;
      waitingForQuestion = false;
      return;
    }
  } else {
    btnElement.classList.add("wrong-effect");
    const correctAns = currentQuestion.options[currentQuestion.correct];
    feedbackDiv.innerHTML = "❌ اشتباه! پاسخ صحیح: " + correctAns + "<br>" + currentQuestion.explanation;
    feedbackDiv.style.background = "#fee2e2";
    feedbackDiv.style.color = "#991b1b";
  }
  setTimeout(() => {
    waitingForQuestion = false;
    document.getElementById("diceBtn").disabled = false;
    document.getElementById("optionsDiv").innerHTML = "";
    document.getElementById("questionText").innerHTML = "برای شروع، تاس بینداز!";
    document.getElementById("feedback").innerHTML = "";
  }, 3000);
}

function rollDice() {
  if (waitingForQuestion) { document.getElementById("feedback").innerHTML = "⚠️ اول به سوال جواب بده!"; return; }
  if (playerPos === 25) { document.getElementById("feedback").innerHTML = "🎉 بازی تمام شد! دکمه بازی جدید را بزن."; return; }
  diceValue = Math.floor(Math.random() * 6) + 1;
  document.getElementById("diceResult").innerHTML = "🎲 " + diceValue;
  showQuestion();
}

function restartGame() {
  playerPos = 1;
  waitingForQuestion = false;
  answered = false;
  document.getElementById("playerPos").innerText = "1";
  document.getElementById("diceResult").innerHTML = "";
  document.getElementById("questionText").innerHTML = "برای شروع، تاس بینداز!";
  document.getElementById("optionsDiv").innerHTML = "";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("diceBtn").disabled = false;
  renderBoard();
}

document.getElementById("diceBtn").onclick = rollDice;
document.getElementById("restartBtn").onclick = restartGame;
renderBoard();
document.getElementById("questionText").innerHTML = "برای شروع، تاس بینداز!";
</script>
</body>
</html>
